<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Trading Journal</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14202b;--mute:#5d6b79;--line:#d8e0e8;--win:#1c7a5a;--loss:#c23b4a;--acc:#2f5bd2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17222e;--ink:#e6edf4;--mute:#8d9cab;--line:#27364a;--win:#3fc190;--loss:#f06a78;--acc:#7a9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1050px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.f1{margin-bottom:8px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;width:100%}
.big{font-size:clamp(32px,7vw,48px);font-weight:600;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.stats b{display:block;font-size:17px}.stats span{font-size:12px;color:var(--mute)}
.win{color:var(--win)}.loss{color:var(--loss)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:500}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
#status{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <h1>My trading journal</h1>
  <div class="sub">Trades save to your Google Sheet and Drive automatically. <span id="status"></span></div>

  <details class="card" id="cfg" style="margin-top:14px">
    <summary>Connection settings</summary>
    <div class="f2" style="margin-top:10px">
      <div><label for="url">Apps Script web app URL</label><input id="url" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div><label for="pw">Password</label><input id="pw" type="password"></div>
    </div>
    <button class="btn" id="saveCfg">Save &amp; load trades</button>
  </details>

  <div class="card"><div class="sub">Net P&amp;L</div><div class="big" id="net">₹0</div><div class="stats" id="stats"></div></div>

  <div class="grid">
    <form class="card" onsubmit="return false">
      <h2>Add a trade</h2>
      <div class="f2"><div><label for="date">Date</label><input type="date" id="date"></div><div><label for="sym">Symbol</label><input id="sym" placeholder="NIFTY"></div></div>
      <div class="f2"><div><label for="side">Side</label><select id="side"><option>Long</option><option>Short</option></select></div><div><label for="qty">Quantity</label><input type="number" id="qty" step="any"></div></div>
      <div class="f2"><div><label for="ent">Entry</label><input type="number" id="ent" step="any"></div><div><label for="ext">Exit</label><input type="number" id="ext" step="any"></div></div>
      <div class="f2"><div><label for="fee">Charges (₹)</label><input type="number" id="fee" step="any" value="0"></div><div><label for="setup">Setup</label><input id="setup"></div></div>
      <div class="f1"><label for="mood">How did you feel?</label><select id="mood"><option>Calm</option><option>Confident</option><option>FOMO</option><option>Revenge</option><option>Fear</option><option>Bored</option></select></div>
      <div class="f1"><label for="note">Notes</label><textarea id="note" rows="2"></textarea></div>
      <button class="btn p" id="add">Save trade</button>
      <div id="err" class="loss sub" role="alert"></div>
    </form>
    <div style="min-width:0">
      <div class="card"><h2>Equity curve</h2><div id="chart"></div></div>
      <div class="card"><h2>Trades</h2><div class="scroll" id="list"></div></div>
    </div>
  </div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)},T=[];
var ls={get:function(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
$("url").value=ls.get("jUrl");$("pw").value=ls.get("jPw");$("date").value=new Date().toISOString().slice(0,10);
function status(m){$("status").textContent=m}
function inr(n,s){return(s&&n>0?"+":"")+(n<0?"−":"")+"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN")}
function cls(n){return n>0?"win":n<0?"loss":""}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function post(body){body.key=ls.get("jPw");
  return fetch(ls.get("jUrl"),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json()})}
function load(){
  if(!ls.get("jUrl")){status("Add your web app URL in Connection settings.");$("cfg").open=true;render();return}
  status("Loading…");
  fetch(ls.get("jUrl")+"?key="+encodeURIComponent(ls.get("jPw"))).then(function(r){return r.json()}).then(function(d){
    if(d.error){status("Wrong password.");return}
    T=d.trades||[];status("Synced.");render()}).catch(function(){status("Could not reach Google. Check the URL.")})}
$("saveCfg").onclick=function(){ls.set("jUrl",$("url").value.trim());ls.set("jPw",$("pw").value);load()};
$("add").onclick=function(){
  var t={id:Date.now(),date:$("date").value,symbol:$("sym").value.trim().toUpperCase(),side:$("side").value,qty:parseFloat($("qty").value),
   entry:parseFloat($("ent").value),exit:parseFloat($("ext").value),charges:parseFloat($("fee").value)||0,setup:$("setup").value.trim(),feeling:$("mood").value,note:$("note").value.trim()};
  if(!t.date||!t.symbol||!(t.qty>0)||isNaN(t.entry)||isNaN(t.exit)){$("err").textContent="Enter date, symbol, quantity, entry and exit.";return}
  t.pnl=(t.exit-t.entry)*t.qty*(t.side==="Long"?1:-1)-t.charges;$("err").textContent="";status("Saving…");
  post({action:"add",trade:t}).then(function(d){if(d.error){status("Wrong password.");return}T.push(t);status("Saved to Google Sheet.");render();
    ["sym","qty","ent","ext","setup","note"].forEach(function(i){$(i).value=""})}).catch(function(){status("Save failed. Trade was not stored.")})};
$("list").onclick=function(e){var id=e.target.getAttribute("data-id");if(!id)return;id=Number(id);status("Deleting…");
  post({action:"delete",id:id}).then(function(){T=T.filter(function(t){return Number(t.id)!==id});status("Deleted.");render()}).catch(function(){status("Delete failed.")})};
function render(){
  var S=T.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id}),ps=S.map(function(t){return Number(t.pnl)});
  var net=ps.reduce(function(a,b){return a+b},0),w=ps.filter(function(p){return p>0}),l=ps.filter(function(p){return p<0});
  var gw=w.reduce(function(a,b){return a+b},0),gl=-l.reduce(function(a,b){return a+b},0);
  $("net").textContent=inr(net,true);$("net").className="big "+cls(net);
  var st=[["Trades",S.length],["Win rate",S.length?Math.round(w.length/S.length*100)+"%":"–"],["Profit factor",gl?(gw/gl).toFixed(2):"–"],["Avg win",w.length?inr(gw/w.length):"–"],["Avg loss",l.length?inr(-gl/l.length):"–"]];
  $("stats").innerHTML=st.map(function(s){return"<div><b>"+s[1]+"</b><span>"+s[0]+"</span></div>"}).join("");
  if(!S.length){$("chart").innerHTML='<div class="sub">The curve appears after your first trade.</div>';$("list").innerHTML='<div class="sub">No trades yet.</div>';return}
  var eq=0,pts=[0];ps.forEach(function(p){eq+=p;pts.push(eq)});
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);if(mn===mx){mn-=1;mx+=1}
  var X=function(i){return 10+620*i/(pts.length-1||1)},Y=function(v){return 10+170*(1-(v-mn)/(mx-mn))};
  $("chart").innerHTML='<svg viewBox="0 0 640 190" width="100%"><line x1="10" x2="630" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--line)" stroke-dasharray="3 3"/><path d="'+pts.map(function(v,i){return(i?"L":"M")+X(i)+" "+Y(v)}).join("")+'" fill="none" stroke="'+(eq>=0?"var(--win)":"var(--loss)")+'" stroke-width="2.2"/></svg>';
  $("list").innerHTML="<table><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Exit</th><th>P&amp;L</th><th>Setup</th><th>Feeling</th><th>Note</th><th></th></tr></thead><tbody>"+
   S.slice().reverse().map(function(t){return"<tr><td>"+esc(t.date)+"</td><td><b>"+esc(t.symbol)+"</b></td><td>"+esc(t.side)+"</td><td>"+esc(t.qty)+"</td><td>"+esc(t.entry)+"</td><td>"+esc(t.exit)+'</td><td class="'+cls(t.pnl)+'">'+inr(Number(t.pnl),true)+"</td><td>"+esc(t.setup)+"</td><td>"+esc(t.feeling)+"</td><td>"+esc(String(t.note||"").slice(0,28))+'</td><td><button class="x" data-id="'+esc(t.id)+'" aria-label="Delete trade">×</button></td></tr>'}).join("")+"</tbody></table>"}
load();
})();
</script>
</body>
</html>
