<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockyMind – Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pr:#0b5fdc;--g:#15803d;--r:#c81e2b;--y:#a16207;--soft:#eef3fd;--m:'Space Mono',monospace}
[data-theme=dark]{--bg:#0e1117;--card:#161b24;--tx:#e8ecf3;--mu:#8b95a7;--bd:#262d3a;--soft:#1c2536}
*{box-sizing:border-box;margin:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;display:flex;min-height:100vh}
button,input,select{font:inherit;color:inherit}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;padding:14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--bd)}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--pr);font-style:normal}
.logo b{color:var(--pr)}.logo span{flex:1}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:8px;width:28px;height:28px;cursor:pointer}
nav{padding:10px 8px;flex:1}
nav small{display:block;font:10px var(--m);letter-spacing:.15em;color:var(--mu);padding:6px 8px 8px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
nav a.on{background:var(--soft);color:var(--tx);border-left-color:var(--pr)}
.user{border-top:1px solid var(--bd);padding:12px;display:flex;gap:8px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:#1e3a8a;color:#fff;display:grid;place-items:center;font-size:12px}
.user div{font-size:12px;font-weight:600}.user em{display:block;font:10px var(--m);color:var(--pr);font-style:normal}
main{flex:1;min-width:0}
header{height:54px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:600;font-size:16px}
header div{display:flex;gap:8px;align-items:center;font-size:13px}
.pill{border:1px solid var(--bd);border-radius:20px;padding:6px 12px;background:var(--card);font-weight:500}
#view{padding:24px;max-width:1240px;margin:auto}
h1{font-size:26px;font-weight:700}.sub{color:var(--mu);margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:18px;overflow:hidden}
.ch{padding:14px 18px;border-bottom:1px solid var(--bd);font:600 12px var(--m);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.cb{padding:18px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi div{padding:16px 18px;border-right:1px solid var(--bd)}
.kpi small{font:600 11px var(--m);color:var(--mu);letter-spacing:.06em}
.kpi b{display:block;font:700 22px var(--m);margin:6px 0 2px}.kpi span{font:11px var(--m);color:var(--mu)}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.p{color:var(--pr)}.mu{color:var(--mu)}
.mono{font-family:var(--m)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid .card{margin:0}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:var(--card);padding:7px 14px;cursor:pointer;color:var(--mu);font-weight:500}
.tabs button.on{background:var(--pr);color:#fff}
table{width:100%;border-collapse:collapse}
th{font:600 11px var(--m);color:var(--mu);text-align:left;padding:12px 14px;letter-spacing:.05em;border-bottom:1px solid var(--bd)}
td{padding:13px 14px;border-bottom:1px solid var(--bd);font-family:var(--m);font-size:13px}
td:first-child,th:first-child{padding-left:18px}
.tag{background:var(--soft);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font:12px 'Space Grotesk'}
.open{background:#dbeafe;color:var(--pr);border-radius:20px;padding:2px 10px;font:600 12px 'Space Grotesk'}
.heat{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;overflow-x:auto;min-width:760px}
.hm b{display:block;font:600 11px var(--m);text-align:center;border-bottom:1px solid var(--bd);margin-bottom:6px;padding-bottom:4px}
.hm div{display:flex;gap:2px}.hm div div{flex-direction:column;gap:2px}
.hm i{width:15px;height:15px;border:1px solid var(--bd);border-radius:3px;font:7px var(--m);display:grid;place-items:center;color:var(--mu);font-style:normal}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .d{min-height:92px;border:1px solid var(--bd);border-radius:10px;padding:8px;font-weight:600;font-size:13px;background:var(--card)}
.cal .d.t{border:2px solid var(--pr)}.cal .h{text-align:center;font:11px var(--m);color:var(--mu);padding:8px}
.cal .d em{display:block;font:11px var(--m);font-style:normal;margin-top:6px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.stat small{font:10px var(--m);color:var(--mu);letter-spacing:.06em}.stat b{display:block;font:700 18px var(--m);margin-top:4px}
label{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-bottom:5px}
input,select{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:10px 12px;font-family:var(--m)}
.f{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.dark{background:linear-gradient(135deg,#0b0d12,#1a1533);color:#fff;border-radius:16px;padding:28px;margin-bottom:18px}
.dark .row{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-end}
.dark small{font:11px var(--m);color:#9ca3af;letter-spacing:.08em}
.dark .big{font:700 64px var(--m);line-height:1}.dark b{font:700 24px var(--m);display:block;margin:4px 0}
.bar{height:5px;background:#262b38;border-radius:4px;margin-top:22px}.bar i{display:block;height:100%;background:#4ade80;border-radius:4px}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:9}
.modal.on{display:grid}.modal .card{width:min(520px,94vw);margin:0}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.soon{font:700 9px var(--m);background:#dbeafe;color:var(--pr);border-radius:4px;padding:2px 6px;margin-left:6px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:44px;text-align:center;color:var(--mu)}
@media(max-width:800px){aside{display:none}#view{padding:14px}}
.tfb{border:0;background:none;padding:4px 9px;font:12px var(--m);color:var(--mu);cursor:pointer;border-radius:6px}.tfb.on{background:var(--soft);color:var(--pr);font-weight:700}
.tbar{display:flex;align-items:center;gap:4px;padding:8px 14px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);flex-wrap:wrap}.sep{width:1px;height:20px;background:var(--bd);margin:0 8px}.tfb.p{color:var(--pr);font-weight:600}.cnt{background:var(--pr);color:#fff;border-radius:10px;padding:0 6px;font-size:11px}
.menu{position:absolute;top:34px;left:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;z-index:5;min-width:170px;box-shadow:0 8px 24px #0003}.menu label{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:13px;padding:7px;margin:0;cursor:pointer}.menu input{width:auto}
</style>
</head>
<body>
<aside>
  <div class="logo"><i>◎</i><span>Stocky<b>Mind</b></span><button class="ib" id="th" title="Theme">☾</button></div>
  <nav id="nav"><small>JOURNAL</small></nav>
  <div class="user"><div class="av">B</div><div>bgt.pramod1<em>• Basic</em></div></div>
</aside>
<main><header><span id="ttl">Dashboard</span><div><span class="pill">All time ▾</span><button class="ib" id="py">‹</button><b id="yr">2026</b><button class="ib" id="ny">›</button></div></header><div id="view"></div></main>
<div class="modal" id="md"><div class="card"><div class="ch">Add Trade <button class="ib" onclick="md.classList.remove('on')">✕</button></div><div class="cb"><div class="f" id="tf"></div><br><button class="btn" id="sv">Save trade</button></div></div></div>
<script>
const $=s=>document.querySelector(s),pages=['Dashboard','Analytics','Trades','Positions','Calendar','Import','Calculator','Settings','Accounts'],icons=['▦','▥','↗','◷','▤','⇪','▣','⚙','▭'];
const KEY='stockymind_v1';let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{cap:500000,year:2026,trades:[{id:1,date:'2026-11-21',symbol:'RELIANCE',setup:'Base on Base',tf:'1D',entry:51,sl:48,qty:10,cmp:1377.5,exit:null,exitDate:null,plan:true}]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const pnl=t=>((t.exit??t.cmp??t.entry)-t.entry)*t.qty,isOpen=t=>t.exit==null,risk=t=>Math.abs(t.entry-t.sl)*t.qty;
const cls=n=>n>0?'g':n<0?'r':'mu',pc=n=>(n>=0?'+':'')+n.toFixed(2)+'%';
const yt=()=>S.trades.filter(t=>t.date.startsWith(S.year));
const closed=()=>yt().filter(t=>!isOpen(t));
const setups=['Base on Base','Box','Channel','CwH','Flag','iH&S','Breakout','Pullback'];
$('#nav').innerHTML+=pages.map((p,i)=>`<a href="#${p.toLowerCase()}" data-p="${p}"><span>${icons[i]}</span>${p}</a>`).join('');
$('#th').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'':'dark';$('#th').textContent=d.dataset.theme?'☀':'☾'};
$('#py').onclick=()=>{S.year--;go()};$('#ny').onclick=()=>{S.year++;go()};

const P={};
P.Dashboard=()=>{const c=closed(),all=yt(),net=c.reduce((a,t)=>a+pnl(t),0),w=c.filter(t=>pnl(t)>0).length,fin=S.cap+net;
const rr=c.length?c.reduce((a,t)=>a+pnl(t)/risk(t),0)/c.length:0,best=c.length?Math.max(...c.map(pnl)):null;
const byD={};c.forEach(t=>byD[t.exitDate||t.date]=(byD[t.exitDate||t.date]||0)+pnl(t));
const hm=[...Array(11)].map((_,m)=>{const first=new Date(S.year,m,1),off=(first.getDay()+6)%7,days=new Date(S.year,m+1,0).getDate(),cols={};
for(let d=1;d<=days;d++){const dt=new Date(S.year,m,d),wd=dt.getDay();if(wd==0||wd==6)continue;const wk=Math.floor((d-1+off)/7);(cols[wk]=cols[wk]||{})[wd]=d}
const key=d=>`${S.year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
return`<div class="hm"><b>${first.toLocaleString('en',{month:'short'}).toUpperCase()}</b><div>${Object.keys(cols).map(k=>`<div>${[1,2,3,4,5].map(w=>{const d=cols[k][w];if(!d)return'<i style="border:0"></i>';const v=byD[key(d)];return`<i style="${v>0?'background:#15803d;color:#fff':v<0?'background:#c81e2b;color:#fff':''}">${d}</i>`}).join('')}</div>`).join('')}</div></div>`}).join('');
let eq=S.cap,pts=[eq];c.sort((a,b)=>a.date>b.date?1:-1).forEach(t=>pts.push(eq+=pnl(t)));
const mn=Math.min(...pts),mx=Math.max(...pts)||1,sp=mx-mn||1;
const line=pts.length>1?`<svg viewBox="0 0 600 200" style="width:100%;height:260px"><polyline fill="none" stroke="#0b5fdc" stroke-width="2.5" points="${pts.map((v,i)=>`${i*600/(pts.length-1)},${190-(v-mn)/sp*180}`).join(' ')}"/></svg>`:'<div class="empty" style="padding:110px 0">No data for selected months</div>';
const mons=[...Array(12)].map((_,m)=>{const tt=c.filter(t=>+t.date.slice(5,7)==m+1),all2=all.filter(t=>+t.date.slice(5,7)==m+1),p=tt.reduce((a,t)=>a+pnl(t),0);return`<tr style="${all2.length?'':'opacity:.5'}"><td>${new Date(2000,m).toLocaleString('en',{month:'short'})}</td><td>${all2.length||'–'}</td><td>${tt.length?inr(p):'–'}</td><td class="${cls(p)}">${tt.length?pc(p/S.cap*100):'–'}</td><td class="p">${inr(S.cap)}</td></tr>`}).join('');
return`<div class="card"><div class="ch">◈ KPI Strip</div><div class="kpi">
<div><small>STARTING CAPITAL</small><b class="p">${inr(S.cap)}</b><span>Initial investment</span></div>
<div><small>FINAL CAPITAL</small><b class="p">${inr(fin)}</b><span>Net P/L: ${inr(net)}</span></div>
<div><small>YTD RETURN</small><b class="${cls(net)}">${pc(net/S.cap*100)}</b><span>Total P/L ${inr(net)}</span></div>
<div><small>TOTAL TRADES</small><b>${all.length}</b><span>${c.length} closed · ${all.length-c.length} open</span></div>
<div><small>WIN RATE</small><b class="${c.length&&w?'g':'r'}">${c.length?(w/c.length*100).toFixed(1):'0.0'}%</b><span>${w}/${c.length} winners</span></div>
<div><small>AVG R:R</small><b class="${rr>0?'g':'r'}">${rr.toFixed(2)}x</b><span>among closed trades</span></div>
<div><small>PLAN FOLLOWED</small><b class="g">${all.length?Math.round(all.filter(t=>t.plan).length/all.length*100):0}%</b><span>${all.filter(t=>t.plan).length}/${all.length} trades</span></div>
<div style="border:0"><small>BEST TRADE</small><b class="g">${best==null?'–':inr(best)}</b><span>${best==null?'–':''}</span></div></div></div>
<div class="card"><div class="ch">⬡ Trading Calendar</div><div class="cb" style="overflow-x:auto"><div class="heat">${hm}</div></div></div>
<div class="card"><div class="ch">△ Equity Curve</div><div class="cb">${line}</div></div>
<div class="card"><div class="ch">▦ Monthly Table</div><div style="overflow-x:auto"><table><tr><th>MONTH</th><th>TRADES</th><th>NET P/L</th><th>RETURN</th><th>CAPITAL</th></tr>${mons}</table></div></div>`};

P.Analytics=()=>{const c=closed(),all=yt(),w=c.filter(t=>pnl(t)>0),l=c.filter(t=>pnl(t)<0),net=all.reduce((a,t)=>a+pnl(t),0);
const sd={};all.forEach(t=>sd[t.setup]=(sd[t.setup]||0)+1);
const box=(t,b)=>`<div class="card"><div class="ch">${t}</div><div class="cb">${b}</div></div>`;
return`<div class="grid">
${box('Performance Range',`<div style="background:#e8f3ec;border-left:4px solid var(--g);padding:14px;border-radius:8px;margin-bottom:12px"><small class="mono mu">Period · ${S.year}</small><div class="mono g" style="font-size:30px;font-weight:700">${pc(net/S.cap*100)}</div></div><table><tr><td>Trades</td><td>${all.length}</td></tr><tr><td>Win Rate</td><td class="r">${c.length?(w.length/c.length*100).toFixed(1):'0.0'}%</td></tr><tr><td>Net P/L</td><td class="${cls(net)}">${inr(net)}</td></tr></table>`)}
${box('Streaks & Drawdown',`<div class="stat" style="grid-template-columns:1fr"><div><small>MAX WINNING STREAK</small><b class="g">0</b></div><div><small>MAX LOSING STREAK</small><b class="r">0</b></div><div><small>MAX DRAWDOWN</small><b class="y">-0.00%</b></div></div>`)}
${box('Trades & Win Rate',`<h2 class="p">${all.length} trades</h2><p class="mu">${c.length?'':'0% win rate'}</p><div class="stat" style="margin-top:14px"><div><small>WINS</small><b class="g">${w.length}</b></div><div><small>LOSSES</small><b class="r">${l.length}</b></div></div>`)}
${box('Avg Gain & Loss',`<h2 class="g">${w.length?inr(w.reduce((a,t)=>a+pnl(t),0)/w.length):'No data'}</h2><p class="mu">no losses recorded</p>`)}
${box('Setup Distribution',Object.keys(sd).length?Object.entries(sd).map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>${k}</span><b class="mono">${v}</b></div><div class="bar" style="background:var(--bd);margin:0 0 10px"><i style="width:${v/all.length*100}%;background:var(--pr)"></i></div>`).join(''):'<div class="empty">No trades</div>')}
${box('Plan Followed',`<div class="empty"><b class="g" style="font-size:34px">${all.length?Math.round(all.filter(t=>t.plan).length/all.length*100):0}%</b><br>followed</div>`)}
${box('Best & Worst Moves','<div class="empty">'+(c.length?'See Trades':'No closed trades')+'</div>')}
${box('Exit Triggers','<div class="empty">0 trades</div>')}
${box('Proficiency','<div class="empty">0 tags</div>')}
</div>`};

const trRow=t=>`<tr><td>${t.date}</td><td><b style="cursor:pointer;color:var(--pr)" onclick="location.hash='#symbol/${t.symbol}'">${t.symbol}</b></td><td><span class="tag">${t.setup}</span></td><td>${inr(t.entry).replace('₹','₹')}.00</td><td>${isOpen(t)?`<input style="width:96px;padding:5px 8px" value="${t.cmp??''}" onchange="setC(${t.id},this.value)">`:'–'}</td><td>${t.tf}</td><td>${(t.entry*t.qty/S.cap*100).toFixed(2)}%</td><td class="${cls(pnl(t))}">${inr(pnl(t))}</td><td class="${cls(pnl(t))}">${pc(pnl(t)/S.cap*100)}</td><td>${isOpen(t)?'–':(pnl(t)/risk(t)).toFixed(2)}</td><td>${isOpen(t)?'<span class="open">Open</span>':'Closed'}</td><td class="g">${t.plan?'✓':''}</td><td>${t.exitDate||'–'}</td><td><button class="ib" onclick="del(${t.id})">🗑</button></td></tr>`;
P.Trades=()=>`<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center"><button class="btn" onclick="addT()">+ Add Trade</button><input id="q" placeholder="Search symbol, setup…" style="max-width:320px" oninput="fq()"><button class="btn o" id="rfb" onclick="rfp()">⟳ Refresh prices</button>${S.fail?`<span class="r mono" style="font-size:12px">⚠ Live price nahi mili: ${(S.err||[]).join(', ')} — CMP column me khud daal sakte ho</span>`:''}<span class="mu mono" style="margin-left:auto">${yt().length} trades</span></div>
<div class="card" style="overflow-x:auto"><table id="tt"><thead><tr><th>DATE</th><th>SYMBOL</th><th>SETUP</th><th>ENTRY</th><th>CMP</th><th>TF</th><th>POS SIZE %</th><th>P/L ₹</th><th>PF%</th><th>R:R</th><th>STATUS</th><th>PLAN</th><th>EXIT DATE</th><th></th></tr></thead><tbody>${yt().map(trRow).join('')||'<tr><td colspan=14 class="empty">No trades yet</td></tr>'}</tbody></table></div>`;
window.fq=()=>{const v=$('#q').value.toLowerCase();$('#tt tbody').innerHTML=yt().filter(t=>(t.symbol+t.setup).toLowerCase().includes(v)).map(trRow).join('')};
window.del=id=>{if(confirm('Delete this trade?')){S.trades=S.trades.filter(t=>t.id!=id);save();go()}};

P.Positions=()=>{const o=S.trades.filter(isOpen),tp=o.reduce((a,t)=>a+pnl(t),0),tr=o.reduce((a,t)=>a+risk(t),0),exp=o.reduce((a,t)=>a+t.entry*t.qty,0),heat=tr/S.cap*100;
return`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>Open Positions</h1><p class="sub">${o.length} Open · <span class="g">${o.filter(t=>pnl(t)>0).length} green</span> · Updated ${S.upd?new Date(S.upd).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'–'}</p></div><button class="btn o" onclick="rfp()">⟳ Refresh</button></div>
<div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
<div><small>PORTFOLIO HEAT</small><b class="g" style="font-size:32px">${heat.toFixed(1)}%</b><span class="g">Within limit</span></div>
<div><small>OPEN RISK</small><b style="font-size:32px">${inr(tr)}</b><span class="mu">across ${o.length} positions</span></div>
<div><small>TOTAL UNREALISED P&L</small><b class="${cls(tp)}" style="font-size:32px">${tp>=0?'+':''}${inr(tp)}</b><span class="mu">${pc(tp/S.cap*100)} on ${inr(S.cap)}</span></div>
<div><small>OPEN R-MULTIPLE</small><b class="g" style="font-size:32px">${tr?'+'+(tp/tr).toFixed(2)+'R':'0R'}</b></div></div>
<div class="card" style="overflow-x:auto"><table><tr><th>SYMBOL</th><th>QTY</th><th>AVG ENTRY</th><th>CMP</th><th>EXPOSURE</th><th>UNREAL P&L</th><th>R</th><th>RISK ₹</th><th>TSL</th><th>AGE</th></tr>

const i=Math.max(0,Math.min(_cd.length-1,Math.floor(xx/c.bw))),d=_cd[i],cx=Math.max(62,Math.min(c.PW-62,xx));$('#hv').setAttribute('x1',xx);$('#hv').setAttribute('x2',xx);$('#hv').setAttribute('y2',c.H+c.V);
if(yy<=c.H){const v=c.mx-(yy-10)/(c.H-20)*(c.mx-c.mn);$('#hl').setAttribute('y1',yy);$('#hl').setAttribute('y2',yy);$('#hb').setAttribute('y',yy-9);$('#ht').setAttribute('y',yy+4);$('#ht').textContent=v.toFixed(2)}else['hl','hb','ht'].forEach(k=>$('#'+k).style.display='none');
$('#hd').setAttribute('x',cx-62);$('#hd').setAttribute('width',124);$('#hdt').setAttribute('x',cx);$('#hdt').textContent=new Date(d.t).toLocaleString('en-IN',c.intra?{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'short',year:'numeric'});
$('#oh').textContent=`O ${d.o.toFixed(2)}  H ${d.h.toFixed(2)}  L ${d.l.toFixed(2)}  C ${d.c.toFixed(2)}`};
window.xl=()=>['hl','hv','hb','ht','hd','hdt','oh'].forEach(i=>$('#'+i)&&($('#'+i).style.display='none'));
window.snap=()=>{const sv=$('#chs');if(!sv)return;const cs=getComputedStyle(document.documentElement),rs=n=>cs.getPropertyValue(n).trim();const x=new XMLSerializer().serializeToString(sv).replace(/var\(--bd\)/g,rs('--bd')).replace(/var\(--mu\)/g,rs('--mu')),im=new Image(),vb=sv.viewBox.baseVal;
im.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*2;c.height=vb.height*2;const g=c.getContext('2d');g.fillStyle=rs('--card');g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(window._sym||'chart')+'.png';a.click()})};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)};
window.rfp=async()=>{const b=$('#rfb');if(b)b.textContent='Fetching…';S.fail=false;S.err=[];await Promise.all(S.trades.filter(isOpen).map(async t=>{const d=await yf(t.symbol,'5d','1d');if(d&&d.price)t.cmp=d.price;else{S.fail=true;S.err=[...new Set([...S.err,...(window._yerr||[])])]}}));S.upd=S.fail?Date.now()-24e4:Date.now();save();go()};
window.setC=(id,v)=>{const t=S.trades.find(x=>x.id==id);if(t&&+v>0){t.cmp=+v;save();go()}};

P.Settings=()=>{const lists={'Setup Patterns':setups,'Proficiency Tags':['Emotional Control','Exited in Strength','Good Entry','Good Trailing','Protected Breakeven','Small SL'],'Growth Areas':['Biased Analysis','Booked Early',"Didn't Book Loss",'FOMO','Illiquid Stock','Illogical SL'],'Exit Triggers':['Breakeven exit','Market Pressure','R multiples','Random','Rejection','Setup Failed']};
return`<h1>Settings</h1><p class="sub">Manage your journal preferences and data</p>
<div class="card"><div class="ch">Trading</div><div class="cb"><b>Starting Capital (₹)</b><p class="mu" style="margin:4px 0 10px">Used for return % and position sizing.</p><div style="display:flex;gap:10px;max-width:360px"><input id="cp" type="number" value="${S.cap}"><button class="btn" onclick="S.cap=+$('#cp').value||S.cap;save();alert('Saved')">Save</button></div></div></div>
<div class="card"><div class="ch">Appearance</div><div class="cb"><b>Theme</b><br><br><div class="tabs"><button onclick="$('#th').click()">Toggle Light / Dark</button></div></div></div>
<div class="card"><div class="ch">Market Data</div><div class="cb"><b>Exchange</b><p class="mu" style="margin:4px 0 10px">Yahoo Finance suffix: NSE = .NS, BSE = .BO</p><select id="sx" style="max-width:260px"><option value="NS" ${(S.sfx||'NS')=='NS'?'selected':''}>NSE (.NS)</option><option value="BO" ${S.sfx=='BO'?'selected':''}>BSE (.BO)</option></select><br><br><b>Custom CORS proxy (optional)</b><p class="mu" style="margin:4px 0 10px">Apna Cloudflare Worker URL, jaise https://my-proxy.workers.dev/?url= — khali chhodo to public proxies use hongi.</p><input id="px" value="${S.proxy||''}" placeholder="https://…/?url=" style="max-width:520px"><br><br><button class="btn" onclick="S.sfx=$('#sx').value;S.proxy=$('#px').value.trim();save();alert('Saved')">Save</button></div></div>
<div class="card"><div class="ch">Master List</div><div class="cb grid">${Object.entries(lists).map(([k,v])=>`<div><b>${k}</b> <span class="tag">${v.length}</span><div style="margin-top:10px">${v.map(x=>`<div style="border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-bottom:4px">${x}</div>`).join('')}</div></div>`).join('')}</div></div>
<button class="btn o" onclick="if(confirm('Delete ALL data?')){localStorage.removeItem(KEY);location.reload()}">Reset all data</button>`};

P.Accounts=()=>`<div style="display:flex;justify-content:space-between"><div><h1>Trading Accounts</h1><p class="sub">Separate books, unified journal</p></div><button class="btn o" disabled>+ Add Account <span class="soon">SOON</span></button></div>
<div class="card" style="background:var(--soft)"><div class="cb"><b>Multi-Account Tracking</b><span class="soon">SOON</span><p class="mu" style="margin-top:6px">Separate your Intraday, Swing, and Positional books. Each account gets its own capital, P&L curve, and win rate.</p></div></div>
<div class="card"><div class="ch">Your Accounts <span class="tag">1</span></div><div class="cb" style="display:flex;justify-content:space-between"><span><span class="p">●</span> <b>Default</b></span><span class="mono">${inr(S.cap)} · ${S.trades.length} trade</span></div></div>
<div class="card"><div class="ch">Capital History <button class="btn" onclick="ev()">+ Add Event</button></div><div class="cb"><div class="mono" style="display:flex;justify-content:space-between"><span>Start · INITIAL ${inr(S.cap)}</span><span class="mu">= ${inr(S.cap)} Starting balance</span></div>
${(S.events||[]).map(e=>`<div class="mono" style="margin-top:8px">${e.d} · ${e.a>0?'Deposit':'Withdraw'} <span class="${cls(e.a)}">${inr(e.a)}</span></div>`).join('')||'<p class="empty">No events yet — click “Add Event” to record a deposit or withdrawal</p>'}</div></div>`;
window.ev=()=>{const a=+prompt('Amount (negative for withdrawal):');if(!a)return;(S.events=S.events||[]).push({d:new Date().toISOString().slice(0,10),a});S.cap+=a;save();go()};

const fields=[['symbol','Symbol','text'],['date','Date','date'],['entry','Entry','number'],['sl','Stop loss','number'],['qty','Qty','number'],['cmp','CMP / current price','number'],['exit','Exit price (optional)','number'],['tf','Timeframe','text']];
$('#tf').innerHTML=fields.map(([k,l,t])=>`<div><label>${l}</label><input id="f_${k}" type="${t}"></div>`).join('')+`<div><label>Setup</label><select id="f_setup">${setups.map(s=>`<option>${s}</option>`).join('')}</select></div>`;
window.addT=()=>{$('#f_date').value=new Date().toISOString().slice(0,10);$('#f_tf').value='1D';md.classList.add('on')};
$('#sv').onclick=()=>{const g=k=>$('#f_'+k).value,e=+g('entry'),q=+g('qty');if(!g('symbol')||!e||!q)return alert('Symbol, entry and qty are required');
const x=g('exit')?+g('exit'):null;S.trades.push({id:Date.now(),date:g('date'),symbol:g('symbol').toUpperCase(),setup:g('setup'),tf:g('tf'),entry:e,sl:+g('sl')||e*.98,qty:q,cmp:+g('cmp')||e,exit:x,exitDate:x?g('date'):null,plan:true});S.upd=0;save();md.classList.remove('on');go()};

function go(){const h=location.hash.slice(1),sym=h.startsWith('symbol/')?decodeURIComponent(h.slice(7)):null,p=sym?'Trades':(pages.find(x=>x.toLowerCase()==h)||'Dashboard');$('#ttl').textContent=sym?'Symbol Analysis':p;$('#yr').textContent=S.year;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));$('#view').innerHTML=sym?P.Symbol(sym):P[p]();
if(sym)loadC(sym);if(!sym&&['Positions','Trades','Dashboard','Analytics','Calendar'].includes(p)&&(!S.upd||Date.now()-S.upd>3e5)&&!window._rf){window._rf=1;rfp().finally(()=>window._rf=0)}
if(p=='Calculator'){document.querySelectorAll('#view input').forEach(i=>i.oninput=calc);calc()}
if(p=='Import'){const dz=$('#dz');fi.onchange=()=>fi.files[0]&&imp(fi.files[0]);dz.ondragover=e=>e.preventDefault();dz.ondrop=e=>{e.preventDefault();imp(e.dataTransfer.files[0])}}}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
